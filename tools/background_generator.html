<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col md:flex-row select-none">

    <div class="absolute inset-0 z-0 overflow-hidden">
        <canvas id="genCanvas" class="w-full h-full block" width="1360" height="746"></canvas>
    </div>

    <div id="sidebar" class="relative z-10 w-full md:w-96 bg-black/85 backdrop-blur-xl border-r border-white/10 flex flex-col h-full shadow-2xl transition-all duration-300">
        <!-- Header -->
        <div class="p-5 border-b border-white/10 flex items-center justify-between">
            <div>
                <h1 class="font-bold text-lg tracking-wider text-white">MONOLITH GEN</h1>
                <p class="text-xs text-white/50 tracking-widest uppercase">B&amp;W Procedural Engine</p>
            </div>
            <button id="toggleSidebarBtn" class="md:hidden text-white/70 hover:text-white p-2 rounded-lg bg-white/5 hover:bg-white/15 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Scrollable Controls -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-5 space-y-6 text-sm">
            
            <!-- Presets Section -->
            <div class="space-y-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-white/40">Quick Presets</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="loadPreset('quantum')" class="p-2.5 bg-white/5 hover:bg-white/15 border border-white/10 rounded-xl text-xs font-medium text-left transition flex items-center justify-between group">
                        <span>Quantum Grid</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white opacity-40 group-hover:opacity-100"></span>
                    </button>
                    <button onclick="loadPreset('vortex')" class="p-2.5 bg-white/5 hover:bg-white/15 border border-white/10 rounded-xl text-xs font-medium text-left transition flex items-center justify-between group">
                        <span>Void Vortex</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white opacity-40 group-hover:opacity-100"></span>
                    </button>
                    <button onclick="loadPreset('noise')" class="p-2.5 bg-white/5 hover:bg-white/15 border border-white/10 rounded-xl text-xs font-medium text-left transition flex items-center justify-between group">
                        <span>Static Noise</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white opacity-40 group-hover:opacity-100"></span>
                    </button>
                    <button onclick="loadPreset('matrix')" class="p-2.5 bg-white/5 hover:bg-white/15 border border-white/10 rounded-xl text-xs font-medium text-left transition flex items-center justify-between group">
                        <span>Mono Waves</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-white opacity-40 group-hover:opacity-100"></span>
                    </button>
                </div>
            </div>

            <hr class="border-white/10">

            <!-- Pattern Selection -->
            <div class="space-y-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-white/40">Engine Mode</label>
                <select id="patternMode" class="w-full bg-neutral-900 border border-white/15 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-white transition">
                    <option value="grid">Geometric Mesh / Grid</option>
                    <option value="particles">Constellation Particles</option>
                    <option value="waves">Sine Wave Interference</option>
                    <option value="tunnel">Optical Illusion Tunnel</option>
                    <option value="noise">Perlin-style Flow Field</option>
                </select>
            </div>

            <!-- Color Inversion & Tone Controls -->
            <div class="space-y-3">
                <label class="text-xs font-semibold uppercase tracking-wider text-white/40">Palette &amp; Tone</label>
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10">
                    <span class="text-xs">Invert Colors (Light Mode)</span>
                    <input type="checkbox" id="invertColors" class="w-4 h-4 rounded bg-transparent border-white/30 text-white focus:ring-0 cursor-pointer">
                </div>
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10">
                    <span class="text-xs">Monochrome CRT Scanlines</span>
                    <input type="checkbox" id="crtScanlines" class="w-4 h-4 rounded bg-transparent border-white/30 text-white focus:ring-0 cursor-pointer" checked="">
                </div>
            </div>

            <!-- Quantitative Sliders -->
            <div class="space-y-4">
                <label class="text-xs font-semibold uppercase tracking-wider text-white/40">Dynamic Parameters</label>
                
                <!-- Speed / Animation Frequency -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Animation Speed</span>
                        <span id="speedVal" class="font-mono text-white/50">1.0x</span>
                    </div>
                    <input type="range" id="speed" min="0" max="3" step="0.1" value="1.0" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Density / Count -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Density / Element Count</span>
                        <span id="densityVal" class="font-mono text-white/50">80</span>
                    </div>
                    <input type="range" id="density" min="10" max="300" step="5" value="80" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Scale / Zoom -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Scale / Frequency</span>
                        <span id="scaleVal" class="font-mono text-white/50">1.5</span>
                    </div>
                    <input type="range" id="scale" min="0.2" max="5.0" step="0.1" value="1.5" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Glow / Blur Intensity -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Glow Intensity</span>
                        <span id="glowVal" class="font-mono text-white/50">10px</span>
                    </div>
                    <input type="range" id="glow" min="0" max="30" step="1" value="10" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Stroke Width -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Line Weight</span>
                        <span id="strokeVal" class="font-mono text-white/50">1.5px</span>
                    </div>
                    <input type="range" id="stroke" min="0.5" max="8" step="0.5" value="1.5" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- Texture & Noise Overlay -->
            <div class="space-y-3">
                <label class="text-xs font-semibold uppercase tracking-wider text-white/40">Texture &amp; Grain</label>
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-white/70">Film Grain Opacity</span>
                        <span id="grainVal" class="font-mono text-white/50">15%</span>
                    </div>
                    <input type="range" id="grain" min="0" max="50" step="1" value="15" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10">
                    <span class="text-xs">Mouse Interactivity</span>
                    <input type="checkbox" id="mouseReact" class="w-4 h-4 rounded bg-transparent border-white/30 text-white focus:ring-0 cursor-pointer" checked="">
                </div>
            </div>

        </div>

        <!-- Footer Actions with Source Code Copy Button -->
        <div class="p-4 border-t border-white/10 space-y-2 bg-black">
            <div class="flex items-center space-x-2">
                <button onclick="randomizeSettings()" class="flex-1 py-2.5 px-3 bg-white/10 hover:bg-white/20 rounded-xl font-medium text-xs tracking-wider uppercase transition text-white">
                    Randomize
                </button>
                <button onclick="toggleFullscreen()" class="flex-1 py-2.5 px-3 bg-white/10 hover:bg-white/20 rounded-xl font-medium text-xs tracking-wider uppercase transition text-white" id="fsBtn">
                    Fullscreen
                </button>
            </div>
            <button onclick="copySourceCode()" id="copyCodeBtn" class="w-full py-2.5 px-4 bg-white hover:bg-white/90 rounded-xl font-medium text-xs tracking-wider uppercase transition font-semibold flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span id="copyBtnText">Copy Source Code</span>
            </button>
        </div>
    </div>

    <button id="openSidebarBtn" class="absolute top-4 left-4 z-20 md:hidden bg-black/80 backdrop-blur-md border border-white/20 p-3 rounded-2xl text-white shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <script>
        const canvas = document.getElementById('genCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // UI Controls State Reference
        const controls = {
            patternMode: document.getElementById('patternMode'),
            invertColors: document.getElementById('invertColors'),
            crtScanlines: document.getElementById('crtScanlines'),
            speed: document.getElementById('speed'),
            density: document.getElementById('density'),
            scale: document.getElementById('scale'),
            glow: document.getElementById('glow'),
            stroke: document.getElementById('stroke'),
            grain: document.getElementById('grain'),
            mouseReact: document.getElementById('mouseReact')
        };

        const valDisplays = {
            speed: document.getElementById('speedVal'),
            density: document.getElementById('densityVal'),
            scale: document.getElementById('scaleVal'),
            glow: document.getElementById('glowVal'),
            stroke: document.getElementById('strokeVal'),
            grain: document.getElementById('grainVal')
        };

        let width, height;
        let time = 0;
        let particles = [];
        let mouse = { x: -1000, y: -1000, active: false };

        // Resize Canvas dynamically
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);

        // Initialize particles for constellation mode
        function initParticles() {
            particles = [];
            const count = parseInt(controls.density.value);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * (width || 300),
                    y: Math.random() * (height || 300),
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Mouse tracking listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });
        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        // 1. Geometric Grid / Mesh Renderer
        function renderGrid(t, speedVal, densityVal, scaleVal, strokeVal, glowVal) {
            const cols = Math.floor(densityVal / 3) + 5;
            const rows = Math.floor(cols * (height / width));
            const cellW = width / cols;
            const cellH = height / rows;

            ctx.lineWidth = strokeVal;
            if (glowVal > 0) {
                ctx.shadowBlur = glowVal;
                ctx.shadowColor = controls.invertColors.checked ? '#000000' : '#ffffff';
            } else {
                ctx.shadowBlur = 0;
            }

            for (let x = 0; x <= cols; x++) {
                for (let y = 0; y <= rows; y++) {
                    const posX = x * cellW;
                    const posY = y * cellH;
                    const angle = t * speedVal + (x * 0.3 + y * 0.3) * scaleVal;
                    const displacement = Math.sin(angle) * (cellW * 0.4);

                    ctx.beginPath();
                    ctx.arc(posX + displacement, posY + Math.cos(angle) * (cellH * 0.4), strokeVal * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = controls.invertColors.checked ? '#000000' : '#ffffff';
                    ctx.fill();

                    // Connect adjacent points
                    if (x < cols && y < rows) {
                        ctx.beginPath();
                        ctx.moveTo(posX + displacement, posY);
                        ctx.lineTo((x + 1) * cellW, posY + displacement);
                        ctx.strokeStyle = controls.invertColors.checked ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
                        ctx.stroke();
                    }
                }
            }
        }

        // 2. Constellation Particles Renderer
        function renderParticles(t, speedVal, densityVal, scaleVal, strokeVal, glowVal) {
            if (particles.length !== parseInt(densityVal)) {
                initParticles();
            }

            ctx.lineWidth = strokeVal;
            if (glowVal > 0) {
                ctx.shadowBlur = glowVal;
                ctx.shadowColor = controls.invertColors.checked ? '#000000' : '#ffffff';
            } else {
                ctx.shadowBlur = 0;
            }

            const maxDist = 120 * scaleVal;

            particles.forEach((p, index) => {
                p.x += p.vx * speedVal;
                p.y += p.vy * speedVal;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                if (controls.mouseReact.checked && mouse.active) {
                    let dx = mouse.x - p.x;
                    let dy = mouse.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        p.x -= (dx / dist) * 1.5;
                        p.y -= (dy / dist) * 1.5;
                    }
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (strokeVal * 0.5), 0, Math.PI * 2);
                ctx.fillStyle = controls.invertColors.checked ? '#000000' : '#ffffff';
                ctx.fill();

                for (let j = index + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        let alpha = (1 - (dist / maxDist)) * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = controls.invertColors.checked ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
                        ctx.stroke();
                    }
                }
            });
        }

        // 3. Sine Wave Interference Renderer
        function renderWaves(t, speedVal, densityVal, scaleVal, strokeVal, glowVal) {
            const lines = Math.floor(densityVal / 2) + 10;
            ctx.lineWidth = strokeVal;
            
            if (glowVal > 0) {
                ctx.shadowBlur = glowVal;
                ctx.shadowColor = controls.invertColors.checked ? '#000000' : '#ffffff';
            } else {
                ctx.shadowBlur = 0;
            }

            for (let i = 0; i < lines; i++) {
                ctx.beginPath();
                const yOffset = (height / (lines + 1)) * (i + 1);

                for (let x = 0; x <= width; x += 15) {
                    const wave1 = Math.sin(x * 0.005 * scaleVal + t * speedVal + i * 0.2);
                    const wave2 = Math.cos(x * 0.01 * scaleVal - t * (speedVal * 0.5));
                    const y = yOffset + (wave1 + wave2) * (30 * scaleVal);

                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                const alpha = Math.min(1, (i + 1) / lines * 0.5 + 0.1);
                ctx.strokeStyle = controls.invertColors.checked ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
                ctx.stroke();
            }
        }

        // 4. Optical Illusion Tunnel Renderer
        function renderTunnel(t, speedVal, densityVal, scaleVal, strokeVal, glowVal) {
            const count = Math.floor(densityVal / 2) + 15;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxDim = Math.max(width, height) * 1.5;

            ctx.lineWidth = strokeVal;
            if (glowVal > 0) {
                ctx.shadowBlur = glowVal;
                ctx.shadowColor = controls.invertColors.checked ? '#000000' : '#ffffff';
            } else {
                ctx.shadowBlur = 0;
            }

            let timeOffset = (t * speedVal * 50) % (maxDim / count);

            for (let i = count; i >= 0; i--) {
                let size = i * (maxDim / count) + timeOffset;
                let alpha = (i / count);

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate((t * speedVal * 0.1) * (i % 2 === 0 ? 1 : -1));

                ctx.beginPath();
                let sides = Math.floor(4 * scaleVal);
                if (sides < 3) sides = 3;
                if (sides > 8) sides = 8;

                for (let s = 0; s < sides; s++) {
                    let angle = (s / sides) * Math.PI * 2;
                    let px = Math.cos(angle) * size;
                    let py = Math.sin(angle) * size;
                    if (s === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                ctx.strokeStyle = controls.invertColors.checked ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
                ctx.stroke();
                ctx.restore();
            }
        }

        // 5. Perlin-Style Flow Field Renderer
        function renderNoise(t, speedVal, densityVal, scaleVal, strokeVal, glowVal) {
            const cols = Math.floor(densityVal / 2) + 20;
            const rows = Math.floor(cols * (height / width));
            const cellW = width / cols;
            const cellH = height / rows;

            ctx.lineWidth = strokeVal;
            if (glowVal > 0) {
                ctx.shadowBlur = glowVal;
                ctx.shadowColor = controls.invertColors.checked ? '#000000' : '#ffffff';
            } else {
                ctx.shadowBlur = 0;
            }

            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    const px = x * cellW + cellW / 2;
                    const py = y * cellH + cellH / 2;
                    const angle = Math.sin(x * 0.2 * scaleVal + t * speedVal) + Math.cos(y * 0.2 * scaleVal - t * speedVal);

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(angle * Math.PI);

                    ctx.beginPath();
                    ctx.moveTo(-cellW * 0.4, 0);
                    ctx.lineTo(cellW * 0.4, 0);
                    ctx.strokeStyle = controls.invertColors.checked ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)';
                    ctx.stroke();

                    ctx.restore();
                }
            }
        }

        function drawPostProcessing(grainVal, scanlinesActive) {
            if (width <= 0 || height <= 0) return;

            if (grainVal > 0) {
                const grainAlpha = grainVal / 100;
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < grainAlpha * 0.3) {
                        const noise = (Math.random() - 0.5) * 60;
                        data[i] = Math.min(255, Math.max(0, data[i] + noise));
                        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (scanlinesActive) {
                ctx.fillStyle = controls.invertColors.checked ? 'rgba(0, 0, 0, 0.04)' : 'rgba(255, 255, 255, 0.03)';
                for (let y = 0; y < height; y += 4) {
                    ctx.fillRect(0, y, width, 1.5);
                }
            }
        }

        // Main Animation Loop
        function animate() {
            time += 0.016;

            const speedVal = parseFloat(controls.speed.value);
            const densityVal = parseInt(controls.density.value);
            const scaleVal = parseFloat(controls.scale.value);
            const glowVal = parseInt(controls.glow.value);
            const strokeVal = parseFloat(controls.stroke.value);
            const grainVal = parseInt(controls.grain.value);
            const mode = controls.patternMode.value;
            const isInverted = controls.invertColors.checked;

            valDisplays.speed.innerText = speedVal.toFixed(1) + 'x';
            valDisplays.density.innerText = densityVal;
            valDisplays.scale.innerText = scaleVal.toFixed(1);
            valDisplays.glow.innerText = glowVal + 'px';
            valDisplays.stroke.innerText = strokeVal.toFixed(1) + 'px';
            valDisplays.grain.innerText = grainVal + '%';

            if (width > 0 && height > 0) {
                ctx.fillStyle = isInverted ? '#ffffff' : '#000000';
                ctx.fillRect(0, 0, width, height);

                switch(mode) {
                    case 'grid':
                        renderGrid(time, speedVal, densityVal, scaleVal, strokeVal, glowVal);
                        break;
                    case 'particles':
                        renderParticles(time, speedVal, densityVal, scaleVal, strokeVal, glowVal);
                        break;
                    case 'waves':
                        renderWaves(time, speedVal, densityVal, scaleVal, strokeVal, glowVal);
                        break;
                    case 'tunnel':
                        renderTunnel(time, speedVal, densityVal, scaleVal, strokeVal, glowVal);
                        break;
                    case 'noise':
                        renderNoise(time, speedVal, densityVal, scaleVal, strokeVal, glowVal);
                        break;
                }

                drawPostProcessing(grainVal, controls.crtScanlines.checked);
            }

            requestAnimationFrame(animate);
        }

        // Presets Configuration Loader
        function loadPreset(presetName) {
            if (presetName === 'quantum') {
                controls.patternMode.value = 'grid';
                controls.speed.value = 1.0;
                controls.density.value = 60;
                controls.scale.value = 2.0;
                controls.glow.value = 15;
                controls.stroke.value = 2.0;
                controls.grain.value = 10;
            } else if (presetName === 'vortex') {
                controls.patternMode.value = 'tunnel';
                controls.speed.value = 1.5;
                controls.density.value = 100;
                controls.scale.value = 3.5;
                controls.glow.value = 20;
                controls.stroke.value = 1.0;
                controls.grain.value = 25;
            } else if (presetName === 'noise') {
                controls.patternMode.value = 'noise';
                controls.speed.value = 0.8;
                controls.density.value = 120;
                controls.scale.value = 1.2;
                controls.glow.value = 5;
                controls.stroke.value = 1.5;
                controls.grain.value = 30;
            } else if (presetName === 'matrix') {
                controls.patternMode.value = 'waves';
                controls.speed.value = 1.2;
                controls.density.value = 50;
                controls.scale.value = 1.8;
                controls.glow.value = 12;
                controls.stroke.value = 2.5;
                controls.grain.value = 15;
            }
        }

        // Randomizer utility
        function randomizeSettings() {
            const modes = ['grid', 'particles', 'waves', 'tunnel', 'noise'];
            controls.patternMode.value = modes[Math.floor(Math.random() * modes.length)];
            controls.speed.value = (Math.random() * 2.5 + 0.2).toFixed(1);
            controls.density.value = Math.floor(Math.random() * 200 + 30);
            controls.scale.value = (Math.random() * 4 + 0.5).toFixed(1);
            controls.glow.value = Math.floor(Math.random() * 25);
            controls.stroke.value = (Math.random() * 5 + 0.5).toFixed(1);
            controls.grain.value = Math.floor(Math.random() * 40);
        }

        // Fullscreen Toggle Helper with fallback for sandbox permissions
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.warn(`Fullscreen API blocked or unsupported: ${err.message}`);
                        alert('Fullscreen mode is restricted in this preview sandbox. You can view or run the copied source code locally!');
                    });
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Copy Source Code Function using robust execCommand fallback
        function copySourceCode() {
            const sourceCode = document.documentElement.outerHTML;
            const textarea = document.createElement('textarea');
            textarea.value = sourceCode;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                const btnText = document.getElementById('copyBtnText');
                const copyBtn = document.getElementById('copyCodeBtn');
                
                if (successful) {
                    btnText.innerText = 'Source Copied Successfully!';
                    copyBtn.classList.add('bg-emerald-400', 'text-black');
                    setTimeout(() => {
                        btnText.innerText = 'Copy Source Code';
                        copyBtn.classList.remove('bg-emerald-400', 'text-black');
                    }, 2500);
                } else {
                    btnText.innerText = 'Copy Failed';
                    setTimeout(() => {
                        btnText.innerText = 'Copy Source Code';
                    }, 2000);
                }
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(textarea);
        }

        // Mobile Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

        openSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('absolute');
            sidebar.classList.toggle('z-30');
            sidebar.classList.toggle('h-full');
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('absolute');
            sidebar.classList.toggle('z-30');
            sidebar.classList.toggle('-translate-x-full');
        });

        // Initialize on load
        window.onload = function() {
            resize();
            animate();
        };
    </script>

</body></html>
