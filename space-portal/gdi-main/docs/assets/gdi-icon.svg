<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <!-- Globe rings -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="64" cy="64" rx="40" ry="16" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <ellipse cx="64" cy="64" rx="16" ry="40" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <!-- Crosshair -->
  <line x1="64" y1="20" x2="64" y2="44" stroke="#00ff41" stroke-width="1.5" opacity="0.8"/>
  <line x1="64" y1="84" x2="64" y2="108" stroke="#00ff41" stroke-width="1.5" opacity="0.8"/>
  <line x1="20" y1="64" x2="44" y2="64" stroke="#00ff41" stroke-width="1.5" opacity="0.8"/>
  <line x1="84" y1="64" x2="108" y2="64" stroke="#00ff41" stroke-width="1.5" opacity="0.8"/>
  <!-- Center dot -->
  <circle cx="64" cy="64" r="3" fill="#00ff41"/>
  <!-- Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#glow)"/>
  <!-- Text -->
  <text x="64" y="120" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#00ff41">GDI</text>
  <!-- Satellite blip -->
  <circle cx="88" cy="40" r="2.5" fill="#ff0040"/>
  <circle cx="88" cy="40" r="5" fill="none" stroke="#ff0040" stroke-width="0.5" opacity="0.5"/>
</svg>
