<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDI — Access</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;
  --bg-surface:#0e0e10;
  --border:#1a1a1e;
  --text:#fafafa;
  --text-secondary:#a1a1aa;
  --text-muted:#52525b;
  --accent:#ffffff;
  --error:#ef4444;
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

/* Subtle grid background */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

.card{
  width:100%;max-width:380px;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:40px 36px;
  position:relative;
}

/* Top accent line */
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
  border-radius:8px 8px 0 0;
}

.logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:32px;
}
.logo-mark{
  width:28px;height:28px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text);
}
.logo-text{
  font-size:.75rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-secondary);
}

h1{font-size:1.1rem;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.subtitle{font-size:.8rem;color:var(--text-muted);margin-bottom:28px;line-height:1.5}

.form-group{margin-bottom:16px}
label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px}

input{
  width:100%;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:5px;
  padding:10px 13px;
  font-size:.875rem;
  font-family:var(--font);
  color:var(--text);
  outline:none;
  transition:border-color .2s;
}
input:focus{border-color:rgba(255,255,255,.25)}
input::placeholder{color:var(--text-muted)}
input:-webkit-autofill{
  -webkit-box-shadow:0 0 0 100px var(--bg-surface) inset;
  -webkit-text-fill-color:var(--text);
}

.error-msg{
  display:none;
  font-size:.75rem;color:var(--error);
  margin-top:6px;
  padding:8px 10px;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  border-radius:4px;
}
.error-msg.visible{display:block}

button[type=submit]{
  width:100%;margin-top:24px;
  padding:11px;
  background:var(--text);color:var(--bg);
  border:none;border-radius:5px;
  font-family:var(--font);font-size:.875rem;font-weight:600;
  cursor:pointer;
  transition:opacity .2s, transform .15s;
  letter-spacing:.01em;
}
button[type=submit]:hover{opacity:.88;transform:translateY(-1px)}
button[type=submit]:active{transform:translateY(0)}
button[type=submit]:disabled{opacity:.4;cursor:not-allowed;transform:none}

.spinner{
  display:none;
  width:16px;height:16px;
  border:2px solid rgba(9,9,11,.3);
  border-top-color:#09090b;
  border-radius:50%;
  animation:spin .6s linear infinite;
  margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .btn-text{display:none}
.loading .spinner{display:block}

.footer{
  margin-top:28px;padding-top:20px;
  border-top:1px solid var(--border);
  font-size:.7rem;color:var(--text-muted);
  display:flex;justify-content:space-between;align-items:center;
}
.footer a{color:var(--text-muted);text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--text-secondary)}
.classify{
  font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);opacity:.6;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">GDI</div>
    <div class="logo-text">Global Defense Intelligence</div>
  </div>

  <h1>Restricted Access</h1>
  <p class="subtitle">Authorised personnel only. Credentials issued by Artifact Virtual.</p>

  <form id="loginForm" autocomplete="on">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <div class="error-msg" id="errorMsg">Invalid credentials. Contact ali.shakil@artifactvirtual.com for access.</div>
    </div>
    <button type="submit" id="submitBtn">
      <span class="btn-text">Authenticate</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="footer">
    <a href="https://gdi.artifactvirtual.com">← Back to overview</a>
    <span class="classify">Classification: Restricted</span>
  </div>
</div>

<script>
const BACKEND = window.location.origin;

const form = document.getElementById('loginForm');
const btn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');

// If already authenticated, redirect to app
(function checkExistingSession() {
  const token = sessionStorage.getItem('gdi_token');
  const expiry = parseInt(sessionStorage.getItem('gdi_expiry') || '0');
  if (token && expiry > Date.now()) {
    window.location.replace('/');
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('visible');
  btn.disabled = true;
  btn.classList.add('loading');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const resp = await fetch(`${BACKEND}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (!resp.ok) {
      throw new Error('Auth failed');
    }

    const data = await resp.json();

    // Store in sessionStorage — cleared when browser closes
    sessionStorage.setItem('gdi_token', data.access_token);
    sessionStorage.setItem('gdi_role', data.role);
    sessionStorage.setItem('gdi_user', username);
    sessionStorage.setItem('gdi_expiry', String(Date.now() + (data.expires_in * 1000) - 60000));

    // Redirect to app
    window.location.replace('/');

  } catch (err) {
    errorMsg.classList.add('visible');
    btn.disabled = false;
    btn.classList.remove('loading');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});
</script>
</body>
</html>
